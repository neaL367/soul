[package]
name = "soul-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "soul"
path = "src/main.rs"

[dependencies]
anyhow = "1"
soul-core = { path = "../soul-core" }
soul-ui = { path = "../soul-ui" }
soul-backend-gpui = { path = "../soul-backend-gpui" }
common = { path = "../common" }
css = { path = "../css" }
devtools = { path = "../devtools" }
downloads = { path = "../downloads" }
dom = { path = "../dom" }
html = { path = "../html" }
image-decode = { path = "../image-decode" }
ipc = { path = "../ipc" }
layout = { path = "../layout" }
networking = { path = "../networking" }
paint = { path = "../paint" }
raster = { path = "../raster" }
storage = { path = "../storage" }
tokio = { version = "1", features = ["full"] }
tracing.workspace = true
url = "2.5"
[dev-dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
