name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  check:
    name: Build & Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Check Formatting
        run: cargo fmt --all --check

      - name: Clippy Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Tests
        run: cargo test --workspace

      - name: Build Workspace
        run: cargo build --workspace

      - name: Enforce GPUI Isolation
        shell: pwsh
        run: |
          $m = cargo metadata --format-version 1 | ConvertFrom-Json
          $members = $m.workspace_members
          $violators = @(
            $m.packages | Where-Object {
              $members -contains $_.id -and
              $_.name -ne 'soul-backend-gpui' -and
              ($_.dependencies | Where-Object { $_.name -in @('gpui', 'gpui_platform') })
            }
          )
          if ($violators.Count -gt 0) {
            $names = ($violators | ForEach-Object { $_.name }) -join ', '
            throw "gpui leaked into non-soul-backend-gpui crates: $names"
          }
